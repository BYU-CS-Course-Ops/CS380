<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 560" width="1360" height="560" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">
<defs><marker id="aSlate" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#5F7284"/></marker><marker id="aCoral" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#D9614C"/></marker><marker id="aTeal" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#12908F"/></marker></defs>
<rect x="0" y="0" width="1360" height="560" fill="#FFFFFF"/><text x="680" y="36" font-size="21" fill="#14233A" text-anchor="middle" font-weight="bold">Backstage — system context</text><text x="680" y="60" font-size="14.5" fill="#5F7284" text-anchor="middle" font-style="italic">one box · every role and service around it · every arrow labeled</text><rect x="584" y="144" width="332" height="292" rx="18" fill="none" stroke="#12908F" stroke-width="2" stroke-dasharray="7 6"/><rect x="600" y="160" width="300" height="260" rx="12" fill="#14233A" stroke="none" stroke-width="2"/><text x="750" y="275" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Backstage</text><text x="750" y="302" font-size="13" fill="#CFE0E9" text-anchor="middle" font-style="italic">everything we build and own</text><text x="916" y="136" font-size="12.5" fill="#0E6E6D" text-anchor="end" font-style="italic">the boundary</text><rect x="40" y="188" width="250" height="64" rx="26" fill="#FFFFFF" stroke="#12908F" stroke-width="2"/><text x="165" y="217" font-size="17" fill="#0E6E6D" text-anchor="middle" font-weight="bold">Wardrobe lead</text><text x="165" y="237" font-size="12.5" fill="#5F7284" text-anchor="middle" font-style="italic">a person</text><polyline points="290,220 580,220" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="435" y="208" font-size="13.5" fill="#5F7284" text-anchor="middle">item edits, volunteer accounts</text><rect x="40" y="308" width="250" height="64" rx="26" fill="#FFFFFF" stroke="#12908F" stroke-width="2"/><text x="165" y="337" font-size="17" fill="#0E6E6D" text-anchor="middle" font-weight="bold">Volunteer</text><text x="165" y="357" font-size="12.5" fill="#5F7284" text-anchor="middle" font-style="italic">a person</text><polyline points="290,325 580,325" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="435" y="313" font-size="13.5" fill="#5F7284" text-anchor="middle">search, new item, check-out</text><polyline points="580,358 292,358" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="435" y="380" font-size="13.5" fill="#5F7284" text-anchor="middle">results, photo, bin location</text><rect x="1060" y="258" width="250" height="64" rx="26" fill="#FFFFFF" stroke="#12908F" stroke-width="2"/><text x="1185" y="287" font-size="17" fill="#0E6E6D" text-anchor="middle" font-weight="bold">Backup storage</text><text x="1185" y="307" font-size="12.5" fill="#5F7284" text-anchor="middle" font-style="italic">we don't run it</text><polyline points="920,290 1056,290" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="988" y="278" font-size="13.5" fill="#5F7284" text-anchor="middle">nightly backup</text><rect x="40" y="470" width="1280" height="58" rx="8" fill="#E4EEF1" stroke="none" stroke-width="2"/><text x="64" y="496" font-size="13.5" fill="#1E2A36" text-anchor="start">Gone: the Actor and the overdue reminder email. Notifications were never in the MVP — and an actor never touches this system anyway.</text><text x="64" y="515" font-size="13.5" fill="#1E2A36" text-anchor="start">A volunteer checks an item out on their behalf, so Actor is data the system stores, not a user standing outside the box.</text></svg>
