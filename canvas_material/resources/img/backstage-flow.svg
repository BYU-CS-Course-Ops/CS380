<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">
<defs><marker id="aSlate" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#5F7284"/></marker><marker id="aCoral" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#D9614C"/></marker><marker id="aTeal" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#12908F"/></marker></defs>
<rect x="0" y="0" width="1200" height="730" fill="#FFFFFF"/><text x="600" y="36" font-size="21" fill="#14233A" text-anchor="middle" font-weight="bold">Core flow — a volunteer checks out a costume</text><text x="600" y="60" font-size="14.5" fill="#5F7284" text-anchor="middle" font-style="italic">the vertical slice: if only this worked, the theater would still use it</text><rect x="28" y="92" width="184" height="46" rx="8" fill="#14233A" stroke="none" stroke-width="2"/><text x="120" y="122" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Volunteer</text><polyline points="120,138 120,600" fill="none" stroke="#B9C7D2" stroke-width="1.6" stroke-dasharray="5 6"/><rect x="258" y="92" width="184" height="46" rx="8" fill="#14233A" stroke="none" stroke-width="2"/><text x="350" y="122" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Web UI</text><polyline points="350,138 350,600" fill="none" stroke="#B9C7D2" stroke-width="1.6" stroke-dasharray="5 6"/><rect x="488" y="92" width="184" height="46" rx="8" fill="#14233A" stroke="none" stroke-width="2"/><text x="580" y="122" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Catalog</text><polyline points="580,138 580,600" fill="none" stroke="#B9C7D2" stroke-width="1.6" stroke-dasharray="5 6"/><rect x="718" y="92" width="184" height="46" rx="8" fill="#14233A" stroke="none" stroke-width="2"/><text x="810" y="122" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Checkout</text><polyline points="810,138 810,600" fill="none" stroke="#B9C7D2" stroke-width="1.6" stroke-dasharray="5 6"/><rect x="948" y="92" width="184" height="46" rx="8" fill="#14233A" stroke="none" stroke-width="2"/><text x="1040" y="122" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Database</text><polyline points="1040,138 1040,600" fill="none" stroke="#B9C7D2" stroke-width="1.6" stroke-dasharray="5 6"/><polyline points="120,185 350,185" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><circle cx="144" cy="166" r="12" fill="#E8A33D"/><text x="144" y="171" font-size="13.5" fill="#14233A" text-anchor="middle" font-weight="bold">1</text><text x="164" y="172" font-size="13.5" fill="#5F7284" text-anchor="start">searches “bustle”</text><polyline points="350,240 580,240" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><circle cx="374" cy="221" r="12" fill="#E8A33D"/><text x="374" y="226" font-size="13.5" fill="#14233A" text-anchor="middle" font-weight="bold">2</text><text x="394" y="227" font-size="13.5" fill="#5F7284" text-anchor="start">query</text><polyline points="580,295 1040,295" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><circle cx="604" cy="276" r="12" fill="#E8A33D"/><text x="604" y="281" font-size="13.5" fill="#14233A" text-anchor="middle" font-weight="bold">3</text><text x="624" y="282" font-size="13.5" fill="#5F7284" text-anchor="start">select items + bin</text><polyline points="350,360 810,360" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><circle cx="374" cy="341" r="12" fill="#E8A33D"/><text x="374" y="346" font-size="13.5" fill="#14233A" text-anchor="middle" font-weight="bold">4</text><text x="394" y="347" font-size="13.5" fill="#5F7284" text-anchor="start">taps Check out — actor, show, due date</text><polyline points="810,415 1040,415" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><circle cx="834" cy="396" r="12" fill="#E8A33D"/><text x="834" y="401" font-size="13.5" fill="#14233A" text-anchor="middle" font-weight="bold">5</text><text x="854" y="402" font-size="13.5" fill="#5F7284" text-anchor="start">write checkout record</text><polyline points="350,470 120,470" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><circle cx="326" cy="451" r="12" fill="#E8A33D"/><text x="326" y="456" font-size="13.5" fill="#14233A" text-anchor="middle" font-weight="bold">6</text><text x="306" y="457" font-size="13.5" fill="#5F7284" text-anchor="end">item shows as out, with actor and due date</text><polyline points="60,512 1140,512" fill="none" stroke="#B9C7D2" stroke-width="1.4" stroke-dasharray="4 5"/><text x="60" y="502" font-size="13.5" fill="#D9614C" text-anchor="start" font-style="italic">the same flow, when it breaks — strike night, no signal</text><polyline points="810,552 1040,552" fill="none" stroke="#D9614C" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#aCoral)"/><circle cx="834" cy="533" r="12" fill="#D9614C"/><text x="834" y="538" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="854" y="539" font-size="13.5" fill="#D9614C" text-anchor="start">write never arrives</text><path d="M 915 543 l 18 18 M 933 543 l -18 18" stroke="#D9614C" stroke-width="2.6" fill="none"/><polyline points="350,592 120,592" fill="none" stroke="#D9614C" stroke-width="2.2" marker-end="url(#aCoral)"/><circle cx="326" cy="573" r="12" fill="#D9614C"/><text x="326" y="578" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="306" y="579" font-size="13.5" fill="#D9614C" text-anchor="end">form keeps what you typed; retry</text><rect x="60" y="630" width="1080" height="74" rx="8" fill="#E4EEF1" stroke="none" stroke-width="2"/><text x="84" y="656" font-size="13.5" fill="#1E2A36" text-anchor="start">The item is never shown as “out” unless the server confirmed the write. The spike already proved uploads fail on the shop's wifi, so</text><text x="84" y="675" font-size="13.5" fill="#1E2A36" text-anchor="start">this is the flow that has to survive it — not a footnote saying “the user sees an error message and can try again.”</text></svg>
