<rect x="0" y="0" width="1200" height="640" fill="#FFFFFF"/><text x="600" y="36" font-size="21" fill="#14233A" text-anchor="middle" font-weight="bold">Data model — first cut</text><text x="600" y="60" font-size="14.5" fill="#5F7284" text-anchor="middle" font-style="italic">key fields only · solid is MVP, dashed is roadmap</text><rect x="60" y="110" width="230" height="92" rx="8" fill="#F2F6F8" stroke="#14233A" stroke-width="2"/><path d="M 68 110 h 214 a 8 8 0 0 1 8 8 v 26 h -230 v -26 a 8 8 0 0 1 8 -8 z" fill="#14233A"/><text x="175" y="134" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Bin</text><text x="76" y="168" font-size="13" fill="#5F7284" text-anchor="start">short ID</text><text x="76" y="189" font-size="13" fill="#5F7284" text-anchor="start">description</text><rect x="60" y="300" width="230" height="113" rx="8" fill="#F2F6F8" stroke="#14233A" stroke-width="2"/><path d="M 68 300 h 214 a 8 8 0 0 1 8 8 v 26 h -230 v -26 a 8 8 0 0 1 8 -8 z" fill="#14233A"/><text x="175" y="324" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Item</text><text x="76" y="358" font-size="13" fill="#5F7284" text-anchor="start">name, category</text><text x="76" y="379" font-size="13" fill="#5F7284" text-anchor="start">size, condition</text><text x="76" y="400" font-size="13" fill="#5F7284" text-anchor="start">photo</text><rect x="455" y="300" width="250" height="113" rx="8" fill="#F2F6F8" stroke="#14233A" stroke-width="2"/><path d="M 463 300 h 234 a 8 8 0 0 1 8 8 v 26 h -250 v -26 a 8 8 0 0 1 8 -8 z" fill="#14233A"/><text x="580" y="324" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Checkout</text><text x="471" y="358" font-size="13" fill="#5F7284" text-anchor="start">out date</text><text x="471" y="379" font-size="13" fill="#5F7284" text-anchor="start">due date</text><text x="471" y="400" font-size="13" fill="#5F7284" text-anchor="start">returned date</text><rect x="870" y="110" width="230" height="92" rx="8" fill="#F2F6F8" stroke="#14233A" stroke-width="2"/><path d="M 878 110 h 214 a 8 8 0 0 1 8 8 v 26 h -230 v -26 a 8 8 0 0 1 8 -8 z" fill="#14233A"/><text x="985" y="134" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Person</text><text x="886" y="168" font-size="13" fill="#5F7284" text-anchor="start">name</text><text x="886" y="189" font-size="13" fill="#5F7284" text-anchor="start">phone</text><rect x="870" y="300" width="230" height="92" rx="8" fill="#F2F6F8" stroke="#14233A" stroke-width="2"/><path d="M 878 300 h 214 a 8 8 0 0 1 8 8 v 26 h -230 v -26 a 8 8 0 0 1 8 -8 z" fill="#14233A"/><text x="985" y="324" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Show</text><text x="886" y="358" font-size="13" fill="#5F7284" text-anchor="start">title</text><text x="886" y="379" font-size="13" fill="#5F7284" text-anchor="start">opening date</text><rect x="870" y="480" width="230" height="71" rx="8" fill="#F2F6F8" stroke="#5F7284" stroke-width="2" stroke-dasharray="7 5"/><path d="M 878 480 h 214 a 8 8 0 0 1 8 8 v 26 h -230 v -26 a 8 8 0 0 1 8 -8 z" fill="#5F7284"/><text x="985" y="504" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PullList</text><text x="886" y="538" font-size="13" fill="#5F7284" text-anchor="start">items</text><polyline points="175,200 175,296" fill="none" stroke="#5F7284" stroke-width="2"/><text x="163" y="224" font-size="14" fill="#0E6E6D" text-anchor="end" font-weight="bold">1</text><text x="163" y="288" font-size="14" fill="#0E6E6D" text-anchor="end" font-weight="bold">N</text><text x="187" y="252" font-size="13.5" fill="#5F7284" text-anchor="start">holds</text><polyline points="290,355 451,355" fill="none" stroke="#5F7284" stroke-width="2"/><text x="300" y="345" font-size="14" fill="#0E6E6D" text-anchor="start" font-weight="bold">1</text><text x="441" y="345" font-size="14" fill="#0E6E6D" text-anchor="end" font-weight="bold">N</text><text x="370" y="382" font-size="13.5" fill="#5F7284" text-anchor="middle">checked out as</text><polyline points="985,200 985,250 620,250 620,296" fill="none" stroke="#5F7284" stroke-width="2"/><text x="997" y="224" font-size="14" fill="#0E6E6D" text-anchor="start" font-weight="bold">1</text><text x="632" y="290" font-size="14" fill="#0E6E6D" text-anchor="start" font-weight="bold">N</text><text x="800" y="242" font-size="13.5" fill="#5F7284" text-anchor="middle">borrows</text><polyline points="866,355 709,355" fill="none" stroke="#5F7284" stroke-width="2"/><text x="856" y="345" font-size="14" fill="#0E6E6D" text-anchor="end" font-weight="bold">1</text><text x="719" y="345" font-size="14" fill="#0E6E6D" text-anchor="start" font-weight="bold">N</text><text x="788" y="382" font-size="13.5" fill="#5F7284" text-anchor="middle">for</text><polyline points="985,390 985,476" fill="none" stroke="#5F7284" stroke-width="2" stroke-dasharray="7 5"/><text x="997" y="438" font-size="13.5" fill="#5F7284" text-anchor="start" font-style="italic">roadmap only</text><rect x="60" y="470" width="360" height="118" rx="8" fill="#E4EEF1" stroke="none" stroke-width="2"/><text x="84" y="498" font-size="15.5" fill="#14233A" text-anchor="start" font-weight="bold">What isn't here:</text><text x="84" y="522" font-size="13.5" fill="#1E2A36" text-anchor="start">types, nullability, defaults, and the</text><text x="84" y="541" font-size="13.5" fill="#1E2A36" text-anchor="start">search view's code. Those live in the</text><text x="84" y="560" font-size="13.5" fill="#1E2A36" text-anchor="start">codebase, not in the design document.</text></svg>
