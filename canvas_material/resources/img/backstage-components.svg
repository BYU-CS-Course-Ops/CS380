<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" width="1160" height="650" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">
<defs><marker id="aSlate" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#5F7284"/></marker><marker id="aCoral" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#D9614C"/></marker><marker id="aTeal" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9.5 5 L 0 9 z" fill="#12908F"/></marker></defs>
<rect x="0" y="0" width="1160" height="650" fill="#FFFFFF"/><text x="580" y="36" font-size="21" fill="#14233A" text-anchor="middle" font-weight="bold">Backstage — components and interfaces</text><text x="580" y="60" font-size="14.5" fill="#5F7284" text-anchor="middle" font-style="italic">five components · a job written on each · every arrow named</text><rect x="440" y="100" width="260" height="110" rx="10" fill="#14233A" stroke="none" stroke-width="2"/><text x="570" y="130" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Catalog</text><text x="570" y="153" font-size="13.5" fill="#CFE0E9" text-anchor="middle">owns items, bins,</text><text x="570" y="170" font-size="13.5" fill="#CFE0E9" text-anchor="middle">categories, photos;</text><text x="570" y="187" font-size="13.5" fill="#CFE0E9" text-anchor="middle">search</text><rect x="840" y="100" width="250" height="110" rx="10" fill="#14233A" stroke="none" stroke-width="2"/><text x="965" y="130" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Image store</text><text x="965" y="153" font-size="13.5" fill="#CFE0E9" text-anchor="middle">saves and serves</text><text x="965" y="170" font-size="13.5" fill="#CFE0E9" text-anchor="middle">photos behind a</text><text x="965" y="187" font-size="13.5" fill="#CFE0E9" text-anchor="middle">storage interface</text><rect x="60" y="210" width="250" height="110" rx="10" fill="#14233A" stroke="none" stroke-width="2"/><text x="185" y="240" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Web UI</text><text x="185" y="263" font-size="13.5" fill="#CFE0E9" text-anchor="middle">server-rendered pages;</text><text x="185" y="280" font-size="13.5" fill="#CFE0E9" text-anchor="middle">downscales photos</text><text x="185" y="297" font-size="13.5" fill="#CFE0E9" text-anchor="middle">before upload</text><rect x="440" y="330" width="260" height="130" rx="10" fill="#14233A" stroke="none" stroke-width="2"/><text x="570" y="360" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Checkout</text><text x="570" y="383" font-size="13.5" fill="#CFE0E9" text-anchor="middle">owns checkout records;</text><text x="570" y="400" font-size="13.5" fill="#CFE0E9" text-anchor="middle">one open checkout per</text><text x="570" y="417" font-size="13.5" fill="#CFE0E9" text-anchor="middle">item; returns; overdue</text><rect x="60" y="390" width="250" height="92" rx="10" fill="#14233A" stroke="none" stroke-width="2"/><text x="185" y="420" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Auth</text><text x="185" y="443" font-size="13.5" fill="#CFE0E9" text-anchor="middle">two roles:</text><text x="185" y="460" font-size="13.5" fill="#CFE0E9" text-anchor="middle">lead and volunteer</text><path d="M 440 513 a 130 13 0 0 1 260 0 l 0 64 a 130 13 0 0 1 -260 0 z" fill="#1E3352"/><path d="M 440 513 a 130 13 0 0 0 260 0" fill="none" stroke="#5F7284" stroke-width="1.5" opacity="0.7"/><text x="570" y="556" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Database</text><polyline points="310,235 375,235 375,165 436,165" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="367" y="150" font-size="12.5" fill="#5F7284" text-anchor="end">search, item edits</text><polyline points="310,295 375,295 375,380 436,380" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="367" y="345" font-size="12.5" fill="#5F7284" text-anchor="end">check-out / return posts</text><polyline points="185,320 185,386" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="197" y="358" font-size="12.5" fill="#5F7284" text-anchor="start">login</text><polyline points="700,155 836,155" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="768" y="143" font-size="12.5" fill="#5F7284" text-anchor="middle">photo save / fetch</text><polyline points="700,180 770,180 770,545 704,545" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="782" y="350" font-size="12.5" fill="#5F7284" text-anchor="start">items, bins, photo paths</text><polyline points="570,460 570,496" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="582" y="484" font-size="12.5" fill="#5F7284" text-anchor="start">checkout records</text><polyline points="310,436 380,436 380,545 436,545" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="392" y="508" font-size="12.5" fill="#5F7284" text-anchor="start">users, roles</text><rect x="840" y="380" width="250" height="118" rx="8" fill="#E4EEF1" stroke="none" stroke-width="2"/><text x="864" y="408" font-size="15.5" fill="#14233A" text-anchor="start" font-weight="bold">Every box has a job.</text><text x="864" y="432" font-size="13.5" fill="#1E2A36" text-anchor="start">“Handles check-outs” with</text><text x="864" y="451" font-size="13.5" fill="#1E2A36" text-anchor="start">a TBD interface was the one</text><text x="864" y="470" font-size="13.5" fill="#1E2A36" text-anchor="start">box nobody could build from.</text></svg>
