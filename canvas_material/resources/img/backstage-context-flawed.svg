<rect x="0" y="0" width="980" height="500" fill="#FFFFFF"/><text x="490" y="36" font-size="21" fill="#14233A" text-anchor="middle" font-weight="bold">Backstage — system context</text><rect x="400" y="110" width="250" height="330" rx="10" fill="#14233A" stroke="none" stroke-width="2"/><text x="525" y="281" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Backstage</text><rect x="30" y="150" width="210" height="60" rx="26" fill="#FFFFFF" stroke="#12908F" stroke-width="2"/><text x="135" y="186" font-size="17" fill="#0E6E6D" text-anchor="middle" font-weight="bold">Wardrobe lead</text><rect x="30" y="250" width="210" height="60" rx="26" fill="#FFFFFF" stroke="#12908F" stroke-width="2"/><text x="135" y="286" font-size="17" fill="#0E6E6D" text-anchor="middle" font-weight="bold">Volunteer</text><rect x="30" y="350" width="210" height="60" rx="26" fill="#FFFFFF" stroke="#12908F" stroke-width="2"/><text x="135" y="386" font-size="17" fill="#0E6E6D" text-anchor="middle" font-weight="bold">Actor</text><polyline points="240,180 396,180" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="318" y="152" font-size="12.5" fill="#5F7284" text-anchor="middle">edits items,</text><text x="318" y="168" font-size="12.5" fill="#5F7284" text-anchor="middle">manages volunteers</text><polyline points="240,280 396,280" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="318" y="252" font-size="12.5" fill="#5F7284" text-anchor="middle">searches, adds items,</text><text x="318" y="268" font-size="12.5" fill="#5F7284" text-anchor="middle">checks out</text><polyline points="400,380 244,380" fill="none" stroke="#5F7284" stroke-width="2.2" marker-end="url(#aSlate)"/><text x="318" y="368" font-size="12.5" fill="#5F7284" text-anchor="middle">overdue reminder email</text><rect x="760" y="250" width="190" height="60" rx="26" fill="#FFFFFF" stroke="#12908F" stroke-width="2"/><text x="855" y="286" font-size="17" fill="#0E6