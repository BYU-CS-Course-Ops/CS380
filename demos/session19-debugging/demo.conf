# Settings for setup.sh. Edit these to run the demo from a different point in the project.

# The local clone the demo runs in. Nothing in it is ever pushed.
CLONE="$HOME/repos/prop-loft-debug"

# Where the clone comes from: the instructor's working clone of prop-loft/prop-loft,
# which has the session tags (and, before they're published, the local branches).
SOURCE="$HOME/repos/prop-loft"

# The commit the demo branch is built on. patches/branch/ applies to anything from
# session-13 on whose catalog/ app is still just the item list. BASE_FALLBACK is used
# while BASE doesn't exist yet (session-18 is tagged after Session 18, Nov 4).
BASE=session-18
BASE_FALLBACK=docs/design-plain-forms

# The branch setup.sh builds: search, the checkout model, and the Out marker with the bug.
BRANCH=demo/out-marker

# A local-only admin login for the live checkout.
ADMIN_USER=maintainer
ADMIN_PASSWORD=local-demo-only
