# Settings for demo-upstream.sh. Edit these to demo a different point in the project.

# The teaching clone this kit drives (setup.sh creates it; .demo inside it links here).
CLONE="$HOME/repos/prop-loft-class"

# The canonical repo: everything Prop Loft ever builds lands here, never touched by the demo.
CANONICAL=prop-loft/prop-loft

# The disposable upstream students see in class. Created fresh, deleted after.
DEMO_REPO=prop-loft/prop-loft-demo

# The commit the demo starts from. patches/search-feature.patch and the
# patch series under patches/branches/ are built against this commit, so if you change it,
# rebuild them (see "Running it again" in DEMO-SCRIPT.md).
BASELINE=f9816c7    # "Add the revised design document"
